<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Extension Inventory (Sanitizado)</title>
    
    <!-- Inclusão de bibliotecas CDN -->
    <link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --info: #0284c7;
            --bg: #f1f5f9;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: #1e293b;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        
        .header .subtitle {
            opacity: 0.9;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .header .header-actions button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .header .header-actions button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-card .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .stat-card .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-card .stat-label {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .toolbar .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .toolbar .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .toolbar .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .toolbar .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        
        .toolbar .filters select {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            min-width: 120px;
        }
        
        .toolbar .filters select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            overflow-x: auto;
        }
        
        #tabelaExtensoes {
            width: 100%;
            font-size: 13px;
        }
        
        #tabelaExtensoes thead {
            background: #f8fafc;
        }
        
        #tabelaExtensoes th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
        }
        
        #tabelaExtensoes td {
            padding: 10px 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        
        #tabelaExtensoes tr:hover {
            background: #f8fafc;
        }
        
        .ranking-section {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .ranking-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }
        
        .ranking-card h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #1e293b;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .ranking-item .rank-number {
            font-weight: 600;
            color: var(--primary);
            margin-right: 12px;
        }
        
        .ranking-item .rank-name {
            flex: 1;
        }
        
        .ranking-item .rank-count {
            font-weight: 600;
            color: #64748b;
        }
        
        .ranking-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        
        .ranking-bar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--info));
            border-radius: 2px;
            transition: width 0.5s;
        }
        
        @media (max-width: 768px) {
            .ranking-section {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-chrome" style="margin-right: 12px;"></i>Chrome Extension Inventory</h1>
                <div class="subtitle">Dashboard de Auditoria de Extensões (dados fictícios) — Atualizado: <span id="dataAtualizacao"></span></div>
            </div>
            <div class="header-actions">
                <button onclick="exportarCSV()"><i class="fas fa-file-csv"></i> CSV</button>
                <button onclick="window.print()"><i class="fas fa-print"></i> Imprimir/PDF</button>
                <button onclick="recarregarDados()"><i class="fas fa-sync"></i> Recarregar</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-desktop" style="color: var(--primary);"></i></div>
                <div class="stat-number" id="statComputadores">0</div>
                <div class="stat-label">Máquinas Analisadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users" style="color: var(--success);"></i></div>
                <div class="stat-number" id="statUsuarios">0</div>
                <div class="stat-label">Usuários Únicos</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-puzzle-piece" style="color: var(--warning);"></i></div>
                <div class="stat-number" id="statExtensoes">0</div>
                <div class="stat-label">Extensões Únicas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-cubes" style="color: var(--danger);"></i></div>
                <div class="stat-number" id="statInstalacoes">0</div>
                <div class="stat-label">Total de Instalações</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar extensão, usuário, computador..." onkeyup="aplicarFiltros()">
            </div>
            <div class="filters">
                <select id="filterComputer" onchange="aplicarFiltros()">
                    <option value="">Todos os computadores</option>
                </select>
                <select id="filterUser" onchange="aplicarFiltros()">
                    <option value="">Todos os usuários</option>
                </select>
                <select id="filterExtension" onchange="aplicarFiltros()">
                    <option value="">Todas as extensões</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="tabelaExtensoes" class="display">
                <thead>
                    <tr>
                        <th>Computador</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Extensão</th>
                        <th>ID</th>
                        <th>Versão</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="ranking-section">
            <div class="ranking-card">
                <h3><i class="fas fa-chart-bar" style="color: var(--primary); margin-right: 8px;"></i>Extensões Mais Instaladas</h3>
                <div id="rankingMaisInstaladas"></div>
            </div>
            <div class="ranking-card">
                <h3><i class="fas fa-exclamation-triangle" style="color: var(--warning); margin-right: 8px;"></i>Extensões Únicas (1 máquina)</h3>
                <div id="rankingExtensoesUnicas"></div>
            </div>
        </div>
    </div>

    <script>
        // DADOS SANITIZADOS — apenas 3 máquinas, 3 usuários e 3 extensões distintas
        var dadosExtensoes = [
            // PC1: PCFinanceiro / João / Default / Google Docs off-line
            {
                "Computer": "PCFinanceiro",
                "User": "João",
                "Profile": "Default",
                "Extension": "Google Docs off-line",
                "ID": "ghbmnnjooekpmoecnnnilnnbdlolhkhi",
                "Version": "1.107.1_0",
                "ScanDate": "2025-04-10 09:15:00"
            },
            // PC2: PCTI / Matheus / Profile 5 / Adobe Acrobat
            {
                "Computer": "PCTI",
                "User": "Matheus",
                "Profile": "Profile 5",
                "Extension": "Adobe Acrobat: ferramentas para editar, converter e assinar PDFs",
                "ID": "efaidnbmnnnibpcajpcglclefindmkaj",
                "Version": "26.4.2.0_0",
                "ScanDate": "2025-04-11 14:30:00"
            },
            // PC3: PCRH / Paulo / Default / TrafficLight
            {
                "Computer": "PCRH",
                "User": "Paulo",
                "Profile": "Default",
                "Extension": "TrafficLight",
                "ID": "cfnpidifppmenkapgihekkeednfoenal",
                "Version": "3.4.4_0",
                "ScanDate": "2025-04-12 11:45:00"
            }
        ];
        
        function inicializarDashboard() {
            atualizarEstatisticas();
            preencherFiltros();
            renderizarTabela();
            renderizarRanking();
            document.getElementById('dataAtualizacao').textContent = new Date().toLocaleString('pt-BR');
        }
        
        function atualizarEstatisticas() {
            const computadores = new Set(dadosExtensoes.map(d => d.Computer)).size;
            const usuarios = new Set(dadosExtensoes.map(d => d.User)).size;
            const extensoes = new Set(dadosExtensoes.map(d => d.ID)).size;
            const instalacoes = dadosExtensoes.length;
            
            document.getElementById('statComputadores').textContent = computadores;
            document.getElementById('statUsuarios').textContent = usuarios;
            document.getElementById('statExtensoes').textContent = extensoes;
            document.getElementById('statInstalacoes').textContent = instalacoes;
        }
        
        function preencherFiltros() {
            const computers = [...new Set(dadosExtensoes.map(d => d.Computer))].sort();
            const users = [...new Set(dadosExtensoes.map(d => d.User))].sort();
            const extensions = [...new Set(dadosExtensoes.map(d => d.Extension))].sort();
            
            const selectComputer = document.getElementById('filterComputer');
            const selectUser = document.getElementById('filterUser');
            const selectExtension = document.getElementById('filterExtension');
            
            selectComputer.innerHTML = '<option value="">Todos os computadores</option>';
            selectUser.innerHTML = '<option value="">Todos os usuários</option>';
            selectExtension.innerHTML = '<option value="">Todas as extensões</option>';
            
            computers.forEach(c => {
                selectComputer.innerHTML += `<option value="${c}">${c}</option>`;
            });
            
            users.forEach(u => {
                selectUser.innerHTML += `<option value="${u}">${u}</option>`;
            });
            
            extensions.forEach(e => {
                selectExtension.innerHTML += `<option value="${e}">${e}</option>`;
            });
        }
        
        function renderizarTabela() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const dadosFiltrados = aplicarFiltrosDados();
            
            dadosFiltrados.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${d.Computer}</strong></td>
                    <td>${d.User}</td>
                    <td>${d.Profile}</td>
                    <td><span style="font-weight: 500;">${d.Extension}</span></td>
                    <td><code style="font-size: 11px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">${d.ID}</code></td>
                    <td>${d.Version || 'N/A'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function aplicarFiltrosDados() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const computer = document.getElementById('filterComputer').value;
            const user = document.getElementById('filterUser').value;
            const extension = document.getElementById('filterExtension').value;
            
            return dadosExtensoes.filter(d => {
                const matchSearch = 
                    d.Computer.toLowerCase().includes(search) ||
                    d.User.toLowerCase().includes(search) ||
                    d.Extension.toLowerCase().includes(search) ||
                    d.ID.toLowerCase().includes(search);
                
                const matchComputer = !computer || d.Computer === computer;
                const matchUser = !user || d.User === user;
                const matchExtension = !extension || d.Extension === extension;
                
                return matchSearch && matchComputer && matchUser && matchExtension;
            });
        }
        
        function aplicarFiltros() {
            renderizarTabela();
        }
        
        function renderizarRanking() {
            const contagem = {};
            dadosExtensoes.forEach(d => {
                contagem[d.Extension] = (contagem[d.Extension] || 0) + 1;
            });
            
            const sorted = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
            const maxCount = sorted.length > 0 ? sorted[0][1] : 1;
            
            let htmlMaisInstaladas = '';
            sorted.slice(0, 15).forEach(([name, count], index) => {
                const percentage = (count / maxCount) * 100;
                htmlMaisInstaladas += `
                    <div class="ranking-item">
                        <span><span class="rank-number">#${index + 1}</span><span class="rank-name">${name}</span></span>
                        <span class="rank-count">${count} máquina${count > 1 ? 's' : ''}</span>
                    </div>
                    <div class="ranking-bar">
                        <div class="bar-fill" style="width: ${percentage}%;"></div>
                    </div>
                `;
            });
            document.getElementById('rankingMaisInstaladas').innerHTML = htmlMaisInstaladas || '<p style="color: #64748b;">Nenhum dado disponível</p>';
            
            const unicas = sorted.filter(([name, count]) => count === 1);
            let htmlUnicas = '';
            if (unicas.length > 0) {
                unicas.slice(0, 20).forEach(([name, count]) => {
                    const computer = dadosExtensoes.find(d => d.Extension === name)?.Computer || 'Desconhecido';
                    htmlUnicas += `
                        <div class="ranking-item" style="border-left: 3px solid var(--warning); padding-left: 12px;">
                            <span class="rank-name"><i class="fas fa-exclamation-circle" style="color: var(--warning); margin-right: 8px;"></i>${name}</span>
                            <span class="rank-count" style="font-size: 12px; color: #64748b;">${computer}</span>
                        </div>
                    `;
                });
            } else {
                htmlUnicas = '<p style="color: #64748b;">Nenhuma extensão única encontrada</p>';
            }
            document.getElementById('rankingExtensoesUnicas').innerHTML = htmlUnicas;
        }
        
        function exportarCSV() {
            const dadosFiltrados = aplicarFiltrosDados();
            if (dadosFiltrados.length === 0) {
                alert('Nenhum dado para exportar');
                return;
            }
            
            let csv = 'Computador,Usuário,Perfil,Extensão,ID,Versão\n';
            
            dadosFiltrados.forEach(d => {
                csv += `"${d.Computer}","${d.User}","${d.Profile}","${d.Extension}","${d.ID}","${d.Version || ''}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `extensoes_chrome_sanitizado_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }
        
        function recarregarDados() {
            location.reload();
        }
        
        $(document).ready(function() {
            inicializarDashboard();
        });
    </script>
</body>
</html>
